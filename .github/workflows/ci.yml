name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint · types · architecture · tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --locked
      - name: PDF text tools (golden set integrity test)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Formatting and lint
        run: |
          uv run ruff format --check src tests migrations
          uv run ruff check src tests migrations
      - name: Static types (mypy strict)
        run: uv run mypy
      - name: Architecture contracts (import-linter)
        run: uv run lint-imports
      - name: Tests (includes PostgreSQL + pgvector via testcontainers)
        run: uv run pytest --cov --cov-report=term-missing:skip-covered

  contract:
    name: API contract drift (OpenAPI ↔ frontend types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: cd backend && uv python install 3.14 && uv sync --locked
      - run: cd backend && uv run python -m drtc_chatbot.entrypoints.http.export_openapi openapi.json
      - run: cd frontend && npm run api:types
      - name: Fail if the committed contract or types are stale
        run: git diff --exit-code -- backend/openapi.json frontend/src/app/core/api/schema.d.ts

  frontend:
    name: Frontend (lint · unit tests · build · e2e + a11y)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
