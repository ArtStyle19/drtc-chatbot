name: Error
description: Algo no funciona como dice la spec.
title: "[Error] "
labels: ["error"]
body:
  - type: textarea
    id: what
    attributes:
      label: Qué pasó y qué se esperaba
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. ...
    validations:
      required: true
  - type: input
    id: request_id
    attributes:
      label: request_id (si la API devolvió un error)
      description: Aparece en la respuesta de error y en la cabecera X-Request-ID.
  - type: checkboxes
    id: legal
    attributes:
      label: Impacto jurídico
      options:
        - label: Se mostró una cita incorrecta, un texto no vigente como vigente o una afirmación sin respaldo (prioridad máxima)
  - type: markdown
    attributes:
      value: "No incluya datos personales ni contenido de expedientes en el reporte."
