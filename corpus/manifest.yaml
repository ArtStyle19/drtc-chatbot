#
# Reglas (ver corpus/README.md y docs/domain/legal-corpus-rules.md):
#   - Los PDF de sources/ son inmutables: nunca se editan ni se reemplazan; una versión nueva
#     de una norma entra como un documento fuente NUEVO y una versión NUEVA del instrumento.
#   - verification_status solo puede ser "verified_current" tras contrastar el texto con la
#     fuente oficial (SPIJ / El Peruano / portal de la entidad emisora) y registrar quién y cuándo.
#   - Un estado desconocido o no verificado NUNCA se presenta como vigente.
#
# Valores de verification_status: verified_current | unverified | pending_review | superseded | repealed | unknown
# Valores de type: ley | decreto_supremo | decreto_legislativo | decreto_de_urgencia | texto_unico_ordenado
#                  | reglamento | resolucion | ordenanza_regional | otro

