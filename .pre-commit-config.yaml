# Git hooks: `pre-commit install` (done by `make bootstrap`). CI runs the same checks.
default_install_hook_types: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Fixers never touch reference documents, the corpus, or generated/vendored files.
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
        exclude: &untouchable ^(docs/architecture/reference/|corpus/|\.specify/(scripts|templates|workflows|integrations)/|\.claude/skills/|frontend/src/app/core/api/schema\.d\.ts$|backend/openapi\.json$)
      - id: end-of-file-fixer
        exclude: *untouchable
      - id: check-yaml
      - id: check-json
        exclude: ^frontend/(tsconfig.*|\.vscode/.*)\.json$
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
        exclude: ^corpus/sources/
      - id: detect-private-key
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format (backend)
        entry: bash -c 'cd backend && uv run ruff format --check src tests migrations'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: ruff-check
        name: ruff check (backend)
        entry: bash -c 'cd backend && uv run ruff check src tests migrations'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: import-contracts
        name: architecture contracts (import-linter)
        entry: bash -c 'cd backend && uv run lint-imports --no-logo'
        language: system
        files: ^backend/src/.*\.py$
        pass_filenames: false
      - id: prettier
        name: prettier (frontend)
        entry: bash -c 'cd frontend && npx prettier --check "src/**/*.{ts,html,css}" "e2e/**/*.ts"'
        language: system
        files: ^frontend/(src|e2e)/
        pass_filenames: false
